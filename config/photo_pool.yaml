# 시황 대표 이미지에 쓸 **미리 승인된** 사진 보관함
#
# 왜 이런 파일이 있는가
# ---------------------
# 시황은 사람 검수 없이 자동 공개됩니다. 발행 시점에 사진을 검색하면
# `korean bank`가 삼청빌라로, `korean won banknote`가 중국 위안화로 나온 그대로
# 사이트에 걸립니다(둘 다 실측). 그래서 **검색은 사람이 미리 하고, 자동 실행은
# 이 목록에서 고르기만 합니다.**
#
# 처음 20장은 2026-09-06에 Openverse에서, 그다음 14장과 그날 밤의 31장은 2026-09-08에
# Unsplash에서 받아 `Read` 툴로 한 장씩 눈으로 보고 고른 것입니다(업종당 다섯 장 안팎). `seen`은 검색어가 아니라 **사진에 실제로 보이는 것**을 적은
# 줄입니다 — 검색어를 믿지 않는다는 이 저장소의 원칙을 파일 형식으로 굳혔습니다.
#
# 추가하는 방법
# -------------
#   python -m src.photo_search --sheet <이름> <검색어들> --out output/pool
#   대조표를 `Read`로 열어 보고 → assets/photos/에 넣고 → 여기 항목을 적는다
#
# 라이선스: CC BY 계열만 씁니다. 표시 의무가 있어 `credit`을 미디어 캡션에
# 그대로 싣습니다. NC(비상업)·ND(변형금지)는 photo_search가 애초에 거릅니다.
