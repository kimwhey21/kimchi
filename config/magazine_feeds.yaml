      column: 시장 읽기

  # 한국 매체 — 한국어 가이드와 주말 Checkpoint가 씁니다.
  # 2026-09-14에 26개 후보를 직접 받아 보고 **200 응답 + 항목 있음 + 날짜 읽힘**인 것만 남겼고,
  # 그다음 실제 출력을 읽어 신호가 낮은 것을 다시 뺐습니다.
  #
  # **피드가 막혔다고 그 매체를 버리지 않습니다**(2026-09-14, 사용자: "rss가 안되면 직접 찾아보고
  # 조사하면 안되니?"). 길이 둘 더 있습니다.
  #   1) 구글뉴스 `site:` 우회 — 그 매체 기사만 뽑아 오고, 검색어를 얹어 증시 기사로 좁힐 수 있어
  #      원래 섹션 피드보다 오히려 깨끗합니다. 한국경제(RSS 403)·이데일리(연결 거부)·서울경제(404)를
  #      이 길로 되살렸습니다(같은 날 실측: 셋 다 100건, 날짜 전부 읽힘). 잡지 묶음의 로이터도 같은 길입니다.
  #   2) 루틴의 WebSearch — 레이더가 비거나 피드가 실패한 날은 지시문대로 직접 찾습니다.
  #      레이더는 **한 화면으로 훑는 도구**이고, 못 훑은 것을 조사하지 않을 이유는 아닙니다.
  #
  #   RSS도 우회도 안 되어 뺀 것: 파이낸셜뉴스·머니S(404), KBS월드·헤럴드경제(항목 0),
  #                   한겨레(item에 pubDate가 없어 옛 기사가 계속 올라옴).
  #   열리지만 뺀 것(잡음): 인베스팅닷컴 한국(열세 줄이 전부 "올레마 파마슈티컬스 주가, 오늘 왜 급락했나?"
  #                   꼴의 미국 개별종목 번역 기사였습니다 — 한국 주제를 고르는 데 쓸 것이 없습니다),
  #                   구글뉴스 `코스피` 검색(하루 100건이 전부 개장·마감 시세 보도 한 가지였습니다.
  #                   그 이야기는 우리 시황 글이 씁니다 — 레이더는 시황이 안 쓰는 것을 찾는 자리입니다),
  #                   머니투데이·뉴시스(전체 섹션 피드라 연예·스포츠·지역 소식이 절반이었습니다),
  #                   조선비즈 정책(경제가 아니라 정치 기사가 올라왔습니다), 경향 경제(신차 출시 같은 산업 소식),
  #                   연합뉴스 경제(지역상품권·수해 성금 같은 지역 소식이 대부분 — 통신사 경제 와이어는 범위가 너무 넓습니다).
  #                   이들도 증시 기사가 필요하면 `site:` 우회에 검색어를 얹는 것이 낫습니다.
  # 새 매체를 넣기 전에 반드시 직접 받아 보고 **출력까지 읽습니다** — 죽은 피드와 잡음은 둘 다
  # "오늘 화제가 없다"로 보입니다.
  ko:
    - name: 매일경제 증권
      url: https://www.mk.co.kr/rss/50200011/
      column: 증시
    - name: 조선비즈 증권
