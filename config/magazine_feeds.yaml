# 매체 목록은 이 파일 하나입니다 (2026-09-14에 시황 매체까지 모았습니다).
# 두 가지가 들어 있고 쓰임이 다릅니다.
#
#   sets         — 아침 레이더(`scripts/magazine_radar.py`)가 실제로 읽는 RSS 묶음.
#                  `python -m scripts.magazine_radar --set <이름>`. 여기서 얻는 것은 **주제**입니다 —
#                  글 하나를 옮기지 않고 출처 둘 이상을 종합해 씁니다.
#   market_media — 레이더를 돌리지 않고 **이름만** 쓰는 목록. 시황 루틴이 "이 가운데 3곳 이상"을
#                  고를 때 봅니다. 시황은 그날 마감 직후에 쓰는 급한 글이라 RSS를 훑을 시간이
#                  없고, 주제도 이미 정해져 있습니다(그날 장세). `--media kr|us`로 봅니다.
#
# column: 그 매체가 주로 먹여 주는 갈래(레이더가 이 갈래로 묶어 보여 줍니다).
# paid: true면 제목만 레이더로 쓰고 본문 재료는 무료 매체에서 가져옵니다.

sets:

  # 잡지(매거진) 루틴 — 참고 블로그(피우스)가 실제로 가져오는 매체와 투자 블로거
  # (2026-09-13 실측: 전부 열림). 영어 가이드 루틴도 이 묶음을 그대로 씁니다.
  magazine:
    - name: Yahoo Finance
      url: https://finance.yahoo.com/news/rssindex
      column: 시장 읽기
    - name: MarketWatch
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
      column: 시장 읽기
    - name: MarketWatch MarketPulse
      url: https://feeds.content.dowjones.io/public/rss/mw_marketpulse
      column: 시장 읽기
    - name: The Wall Street Journal Markets
      url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
      column: 시장 읽기
      paid: true
    - name: The Motley Fool
      url: https://www.fool.com/feeds/index.aspx
      column: 시장 읽기
    - name: 24/7 Wall St.
      url: https://247wallst.com/feed/
      column: 돈의 상식
    - name: Visual Capitalist
      url: https://www.visualcapitalist.com/feed/
      column: 기업과 기술
    - name: Fortune
      url: https://fortune.com/feed/
      column: 기업과 기술
    - name: Big Think
      url: https://bigthink.com/feed/
      column: 만약에
    - name: Phys.org
      url: https://phys.org/rss-feed/
      column: 과학
    - name: The Conversation
      url: https://theconversation.com/us/articles.atom
      column: 과학
    - name: A Wealth of Common Sense (벤 칼슨)
      url: https://awealthofcommonsense.com/feed/
      column: 투자 심리
    - name: Klement on Investing (요아힘 클레멘트)
      url: https://klementoninvesting.substack.com/feed
      column: 투자 심리
    - name: The Big Picture (배리 리트홀츠)
      url: https://ritholtz.com/feed/
      column: 시장의 역사
    - name: Farnam Street
      url: https://fs.blog/feed/
      column: 투자 심리
    - name: Behavioural Investment (조 위긴스)
      url: https://behaviouralinvestment.com/feed/
      column: 투자 심리
    - name: Novel Investor
      url: https://novelinvestor.com/feed/
      column: 시장의 역사
    - name: Reuters (구글뉴스 경유)
      url: https://news.google.com/rss/search?q=site:reuters.com+markets&hl=en-US&gl=US&ceid=US:en
      column: 시장 읽기

  # 한국 매체 — 한국어 가이드와 주말 Checkpoint가 씁니다.
  # 2026-09-14에 26개 후보를 직접 받아 보고 **200 응답 + 항목 있음 + 날짜 읽힘**인 것만 남겼고,
  # 그다음 실제 출력을 읽어 신호가 낮은 것을 다시 뺐습니다.
  #   열리지 않은 것: 한국경제(403 차단), 이데일리(연결 거부), 서울경제·파이낸셜뉴스·머니S(404),
  #                   KBS월드·헤럴드경제(항목 0), 한겨레(item에 pubDate가 없어 옛 기사가 계속 올라옴).
  #   열리지만 뺀 것: 머니투데이·뉴시스(전체 섹션 피드라 연예·스포츠·지역 소식이 절반이었습니다),
  #                   조선비즈 정책(경제가 아니라 정치 기사가 올라왔습니다), 경향 경제(신차 출시 같은 산업 소식),
  #                   연합뉴스 경제(지역상품권·수해 성금 같은 지역 소식이 대부분이었습니다 — 통신사 경제 와이어는 범위가 너무 넓습니다).
  # 새 매체를 넣기 전에 반드시 직접 받아 보고 **출력까지 읽습니다** — 죽은 피드와 잡음은 둘 다
  # "오늘 화제가 없다"로 보입니다.
  ko:
    - name: 매일경제 증권
