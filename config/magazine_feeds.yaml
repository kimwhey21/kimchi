      column: 증시
    - name: 연합인포맥스 증권
      url: https://news.einfomax.co.kr/rss/S1N2.xml
      column: 증시
    - name: 코스피 (구글뉴스 경유)
      url: https://news.google.com/rss/search?q=%EC%BD%94%EC%8A%A4%ED%94%BC&hl=ko&gl=KR&ceid=KR:ko
      column: 증시
    # 아래 셋은 매체가 아니라 **질문 묶음**입니다 — 가이드 주제 목록(세금·계좌·거래 규칙·기업 이벤트)에
    # 오늘 뉴스가 붙었는지 보는 자리입니다. 2026-09-14 실측: ISA 개편, 양도소득세 신고, 공모주 청약
    # 릴레이, 국고채 금리 상승이 그대로 올라왔습니다. 매체 피드로는 이 말들이 지역 소식에 묻힙니다.
    - name: 세금·계좌 (구글뉴스 경유)
      url: https://news.google.com/rss/search?q=%EC%A3%BC%EC%8B%9D%20OR%20%ED%95%B4%EC%99%B8%EC%A3%BC%EC%8B%9D%20%28%EC%84%B8%EA%B8%88%20OR%20%EB%B0%B0%EB%8B%B9%EC%86%8C%EB%93%9D%EC%84%B8%20OR%20%EC%96%91%EB%8F%84%EC%86%8C%EB%93%9D%EC%84%B8%20OR%20ISA%20OR%20%EC%97%B0%EA%B8%88%EC%A0%80%EC%B6%95%29&hl=ko&gl=KR&ceid=KR:ko
      column: 제도·세금
    - name: 거래·기업 이벤트 (구글뉴스 경유)
      url: https://news.google.com/rss/search?q=%28%EA%B3%B5%EB%A7%A4%EB%8F%84%20OR%20%EB%B0%B0%EB%8B%B9%EA%B8%B0%EC%A4%80%EC%9D%BC%20OR%20%EC%9C%A0%EC%83%81%EC%A6%9D%EC%9E%90%20OR%20%EC%9E%90%EC%82%AC%EC%A3%BC%20OR%20%EA%B3%B5%EB%AA%A8%EC%A3%BC%20%EC%B2%AD%EC%95%BD%20OR%20%EC%95%A1%EB%A9%B4%EB%B6%84%ED%95%A0%29&hl=ko&gl=KR&ceid=KR:ko
      column: 제도·세금
    - name: 금리·환율·물가 (구글뉴스 경유)
      url: https://news.google.com/rss/search?q=%28%EA%B8%B0%EC%A4%80%EA%B8%88%EB%A6%AC%20OR%20%EA%B8%88%ED%86%B5%EC%9C%84%20OR%20%22%EC%9B%90%C2%B7%EB%8B%AC%EB%9F%AC%20%ED%99%98%EC%9C%A8%22%20OR%20%EC%88%98%EC%B6%9C%20%EC%A7%80%ED%91%9C%20OR%20%EC%86%8C%EB%B9%84%EC%9E%90%EB%AC%BC%EA%B0%80%20OR%20%EA%B5%AD%EA%B3%A0%EC%B1%84%20%EA%B8%88%EB%A6%AC%29&hl=ko&gl=KR&ceid=KR:ko
