# 시황 루틴이 조사할 매체 — 이름만. 레이더를 돌리지 않습니다.
# 목록을 고친다는 것은 시황 글의 근거가 달라진다는 뜻입니다(2026-09-14에 옮길 때는 글자 그대로 옮겼습니다).
