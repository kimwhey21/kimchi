      column: 증시
    - name: 연합인포맥스 증권
      url: https://news.einfomax.co.kr/rss/S1N2.xml
      column: 증시
    - name: 한국경제 (구글뉴스 경유 — RSS 403)
      url: https://news.google.com/rss/search?q=site%3Ahankyung.com%20%28%EC%A6%9D%EC%8B%9C%20OR%20%EC%BD%94%EC%8A%A4%ED%94%BC%20OR%20%EC%A3%BC%EC%8B%9D%29&hl=ko&gl=KR&ceid=KR:ko
      column: 증시
    - name: 이데일리 (구글뉴스 경유 — RSS 연결 거부)
      url: https://news.google.com/rss/search?q=site%3Aedaily.co.kr%20%28%EC%A6%9D%EC%8B%9C%20OR%20%EC%BD%94%EC%8A%A4%ED%94%BC%20OR%20%EC%A3%BC%EC%8B%9D%29&hl=ko&gl=KR&ceid=KR:ko
      column: 증시
    - name: 서울경제 (구글뉴스 경유 — RSS 404)
      url: https://news.google.com/rss/search?q=site%3Asedaily.com%20%28%EC%A6%9D%EC%8B%9C%20OR%20%EC%BD%94%EC%8A%A4%ED%94%BC%20OR%20%EC%A3%BC%EC%8B%9D%29&hl=ko&gl=KR&ceid=KR:ko
      column: 증시
