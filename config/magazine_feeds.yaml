  # 영어로 한국 시장을 다루는 매체 — **영어 가이드 전용**(2026-09-14, 사용자 승인 "진행해").
  #
  # 왜 따로 두나: 영어 가이드의 주제 52개는 전부 한국 시장 이야기인데, 잡지 묶음은 미국 일반 매체다.
  # 같은 날 실측으로 잡지 묶음 78줄 가운데 한국 기사가 **0줄**이었다(`won't`가 `won`에 걸린 오탐 하나뿐).
  # 겹칠 수 없는 조합이라 레이더가 아무것도 못 해 준다. 영어 노출 710건 중 700건이 영어 가이드에서
  # 나오는 만큼 효과를 기대할 곳도 여기다.
  #
  # 질의는 실제 출력을 읽어 두 번 고쳤다.
  #   버린 질의: `(kospi OR "korean stocks") (stocks OR shares OR investors)` — 12줄 중 11줄이 지수 시세였다.
  #   버린 질의: `site:reuters.com korea …` — 처음엔 절반이 북한 미사일이었고, `-"North Korea" -missile`로
  #             좁힌 뒤에도 36시간 창에서 일곱 줄 중 한 줄만 한국 기사였다(오바마·찰스 국왕·중국 AI가 올라왔다).
  #             구글뉴스에서 `site:` + OR 묶음은 매체만 고정할 뿐 주제를 좁혀 주지 않는다. 「한국 거시」가 대신한다.
  #   버린 매체: BusinessKorea(영문 RSS에 한글 기사가 섞여 나온다), Korea Herald(교육·스포츠),
  #             KED Global(item에 날짜가 없어 옛 기사가 계속 올라온다), JoongAng Daily·Pulse·
  #             Chosun English·Yonhap English(404).
  en_kr:
    - name: Samsung·SK Hynix·한국은행 (구글뉴스 경유)
      url: https://news.google.com/rss/search?q=%28%22Samsung%20Electronics%22%20OR%20%22SK%20Hynix%22%20OR%20%22Korean%20won%22%20OR%20%22Bank%20of%20Korea%22%29&hl=en-US&gl=US&ceid=US:en
      column: 종목·기업
    - name: 한국 업종 (구글뉴스 경유)
