# 종목 허브 페이지 (2026-09-12, 유입 편성 3번 — 사용자 승인 "3번 5번도 승인").
#
# 코어 워치리스트(config/watchlist_kr.yaml 21 + watchlist_us.yaml 16)의 종목마다 /stocks/<slug>/ 페이지를 두고
# `src/stock_pages.py`가 시세 파일에서 종가·주간·월간·3개월 등락과 3개월 차트, 그 종목이 나온 우리 글 목록을
# 채운다. 이름·업종은 워치리스트에서 가져오므로 여기에는 **주소(slug)와 회사 소개 두 줄**만 적는다.
# 소개는 사실만 — 전망·추천을 쓰지 않는다(글의 판단은 매달 루틴이 쓰는 editorial/stocks/notes_<YYYY-MM>.json에).
#
# 왜: "삼성전자 주가", "SK하이닉스 주가 전망", "테슬라 주가"는 개인 투자자가 가장 많이 치는 검색어이고,
# 재테크농부 118편 제목의 상당수가 종목 이름으로 시작한다. 새 글이 아니라 **한 주소를 계속 갱신**해 검색 순위를 쌓는다.

