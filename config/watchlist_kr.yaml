# ── 동적 티어: 그날 주도주 자동 편입 ──────────────────────────────────
# 코어를 아무리 넓혀도 "목록 밖에서 터진 날"은 남습니다. 그래서 그날 실제로
# 돈이 몰린 종목을 자동으로 붙입니다 (fetch_movers.py).
#
# 기준은 **거래대금**입니다. 등락률 상위로 뽑으면 안 됩니다 — 2026-09-03에
# 실측했더니 등락률 상위는 써니전자 +11.80%, 레버리지 ETN 같은 것들이었고,
# 거래대금 상위는 삼성전기·KB금융·두산에너빌리티·현대차처럼 그날 글이 실제로
# 다뤄야 했던 종목이 나왔습니다.
#
# 실패해도 코어만으로 글이 나갑니다 (fetch_movers가 빈 목록을 돌려줌).
dynamic:
  enabled: true
  count: 6                          # 코어에 없는 상위 몇 개를 붙일지
  universe_size: 100                # 시장별 시가총액 상위 N개 안에서만 고름
  min_market_cap: 1000000000000     # 시가총액 하한 (1조 원)
  markets: ["KOSPI", "KOSDAQ"]

# 동적 티어로 들어온 종목의 영어 표기입니다. 코어는 위에 name_en이 있고,
