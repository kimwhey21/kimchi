# 한국장에서 매번 수집할 지수/종목 목록입니다.
# ticker는 FinanceDataReader가 인식하는 코드입니다 (지수: KS11/KQ11, 종목: 6자리 코드).

macro:
  - { ticker: "KS11",    name: "코스피", name_en: "KOSPI" }
  - { ticker: "KQ11",    name: "코스닥", name_en: "KOSDAQ" }
  - { ticker: "USD/KRW", name: "원/달러 환율", name_en: "USD/KRW", unit: "원" }

# ── 코어 워치리스트 ────────────────────────────────────────────────────
# 매일 무조건 수집하는 고정 목록입니다. 기준은 "그날 어느 업종이 움직이든
# 최소한 섹터 대표 한 종목은 데이터로 잡힌다"입니다.
#
# 전에는 10개였고 반도체 2 / 2차전지 3 / 바이오 2 / 플랫폼 2 / 로봇 1로
# 쏠려 있었습니다. 그래서 2026-09-03처럼 보험·은행이 주도한 날에는 KB금융
# (+5.20%)·신한지주(+3.62%)를 카드로도, 외국인 수급으로도, 대표 이미지로도
# 담지 못하고 본문 문장으로만 인용했습니다. 그 구멍을 메우려고 섹터별로
# 다시 짰습니다. 종목 하나 추가 비용은 시세 0.19초 + 외국인 수급 0.13초라
# 개수 자체는 제약이 아닙니다.
#
# 코어만 사진(publish_editorial._concrete_image_query)과 대표 이미지의
# LARGEST MOVE 대상이 됩니다 — 아래 dynamic으로 들어온 종목은 제외됩니다.
