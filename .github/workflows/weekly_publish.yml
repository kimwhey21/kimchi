name: Weekly Publish

# 주말 편성(2026-09-12, 사용자 결정 "1번 2번 해주고 … 바로 오늘부터"):
#   토 10:00 KST 「주간 결산」  editorial/weekly/review_<토요일>.json  (docs/routine_week_review.md)
#   일 20:00 KST 「다음 주 일정」 editorial/weekly/ahead_<일요일>.json   (docs/routine_week_ahead.md)
#   같은 루틴이 그 주의 큰 이벤트 하나를 골라 「이벤트」 글도 씁니다 — editorial/events/<날짜>_<slug>.json
#   (유입 편성 2026-09-12: FOMC 결과·CPI 발표 시간·옵션 만기처럼 매달 되풀이되는 검색어).
# 두 원고가 main에 커밋되면 바로 공개합니다 — 시황·프리뷰와 같은 정책입니다. 숫자는 우리 시세
# 파일에서만 나오고, 안전장치는 루틴이 커밋 전에 통과시키는 관문(feature_gate)과 발행 뒤 되읽기입니다.
on:
  push:
    # main에만. 루틴 세션의 작업 브랜치(claude/…)도 원고를 담은 채 올라오는데, 공개는 main뿐이다(2026-09-09).
    branches: [main]
    paths:
      - "editorial/weekly/*.json"
      - "editorial/events/*.json"
  workflow_dispatch:
    inputs:
      path:
        description: "발행할 주말 원고 경로 (공백으로 여러 개)"
        required: true
        default: ""

concurrency:
  group: weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 올릴 원고 결정
        id: pick
        run: |
          FILES=""
          if [ -n "${{ github.event.inputs.path }}" ]; then
            FILES="${{ github.event.inputs.path }}"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=d \
                      "${{ github.event.before }}" "${{ github.sha }}" -- editorial/weekly editorial/events \
                    | grep -E '^editorial/(weekly|events)/[^/]+\.json$' | tr '\n' ' ' || true)
          fi
          echo "올릴 원고: ${FILES:-(없음)}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: 바로 공개
        if: ${{ steps.pick.outputs.files != '' }}
        run: |
          for f in ${{ steps.pick.outputs.files }}; do
            echo "== $f =="
            python -m src.publish_feature "$f" --publish
          done
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          SUBSCRIBE_FORM_ACTION: ${{ secrets.SUBSCRIBE_FORM_ACTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      - name: 실패 알림 (텔레그램 운영 대화)
        # 2026-09-12: 어떤 워크플로가 왜 죽었는지 휴대폰으로. 토큰이 없으면 조용히 넘어간다(curl이라 앞 단계가 어디서 죽었든 된다).
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
