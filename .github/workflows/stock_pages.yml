name: Stock Pages

# 종목 허브 페이지 /stocks/<slug>/ 37개 + 목록 /stocks/ (2026-09-12, 유입 편성 3번, 사용자 승인).
# 숫자는 저장소에 매일 커밋되는 시세 파일에서만 오고 LLM을 부르지 않는다. 매주 토요일 11:30 KST(주간 결산 뒤)에
# 새로 쓰고, 매달 1일 루틴이 editorial/stocks/notes_<YYYY-MM>.json(종목별 '최근 흐름')을 커밋하면 그때도 돈다.
# 새 페이지는 저장소 변수 FERMATA_AUTO_PUBLISH가 true면 공개, 아니면 임시저장(있는 페이지는 상태를 건드리지 않는다).
on:
  schedule:
    - cron: "30 2 * * 6"   # 토 11:30 KST
  push:
    branches: [main]
    paths:
      - "editorial/stocks/*.json"
      - "config/stock_pages.yaml"
      - "src/stock_pages.py"
      - "templates/stock.html.j2"
  workflow_dispatch:

concurrency:
  group: stock-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 종목 페이지 갱신
        run: python -m src.stock_pages --market all
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          FERMATA_AUTO_PUBLISH: ${{ vars.FERMATA_AUTO_PUBLISH }}

      - name: 실패 알림 (텔레그램 운영 대화)
        # 2026-09-12: 어떤 워크플로가 왜 죽었는지 휴대폰으로. 토큰이 없으면 조용히 넘어간다(curl이라 앞 단계가 어디서 죽었든 된다).
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
