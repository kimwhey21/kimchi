name: Feature Draft

# 기준표(feature) 원고가 editorial/features/ 아래에 커밋되면 워드프레스에 올립니다.
# 주말 기준표 루틴(docs/routine_feature.md)이 원고를 쓰고 커밋하면 이 워크플로가 올리는데,
# 저장소 변수 FERMATA_AUTO_PUBLISH가 true면 바로 공개하고 아니면 **임시저장**으로 두어
# 사람이 "발행"이라고 한 뒤 `python -m src.publish_feature <원고> --publish`로 공개합니다.
#
# 2026-09-12부터 그 변수가 true입니다(사용자 결정 "체크포인트는 자동발행으로 바꿔주고 바로
# 오늘부터"). 안전장치는 루틴이 커밋 전에 통과시키는 관문(feature_gate)과 발행 뒤 되읽기입니다.
# 변수를 지우거나 false로 두면 코드 수정 없이 임시저장 흐름으로 돌아갑니다.
on:
  push:
    # main에만 (2026-09-09). 루틴 세션의 작업 브랜치(claude/…)도 원고를 담은 채 저장소에 올라오는데,
    # 브랜치 필터가 없어 그 푸시가 이 워크플로를 깨웠다 — 미국장 루틴 브랜치의 첫 푸시(before가 0)가
    # "지정 없음 → 가장 최근 원고"로 엉뚱한 글을 다시 올리고 성적표 단계에서 죽었다. 공개는 main뿐이다.
    branches: [main]
    paths:
      - "editorial/features/*.json"
  workflow_dispatch:
    inputs:
      path:
        description: "발행할 기준표 원고 경로 (공백으로 여러 개)"
        required: true
        default: ""
      publish_live:
        description: "공개 상태로 발행 (사용자가 '발행'이라고 한 뒤에만)"
        type: boolean
        required: false
        default: false

concurrency:
  group: feature-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        # 그래픽에 종목명·소제목이 한글로 들어갑니다. 폰트가 없으면 두부(□)가 찍힙니다.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 올릴 원고 결정
        id: pick
        run: |
          FILES=""
          if [ -n "${{ github.event.inputs.path }}" ]; then
            FILES="${{ github.event.inputs.path }}"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=d \
                      "${{ github.event.before }}" "${{ github.sha }}" -- editorial/features \
                    | grep -E '^editorial/features/[^/]+\.json$' | tr '\n' ' ' || true)
          fi
          echo "올릴 원고: ${FILES:-(없음)}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: 임시저장으로 올리기
        if: ${{ steps.pick.outputs.files != '' }}
        # 자동화 스위치: 저장소 변수 FERMATA_AUTO_PUBLISH=true면 사람 승인 없이 바로
        # 공개한다(기준표 관문 feature_gate가 안전장치). 2026-09-12부터 켜져 있다.
        # 끄면 코드 수정 없이 임시저장으로 돌아간다. 수동 실행의 publish_live도 같다.
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.publish_live }}" = "true" ] || \
             [ "${{ vars.FERMATA_AUTO_PUBLISH }}" = "true" ]; then
            FLAG="--publish"
          fi
          for f in ${{ steps.pick.outputs.files }}; do
            echo "== $f =="
            python -m src.publish_feature "$f" $FLAG
          done
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          SUBSCRIBE_FORM_ACTION: ${{ secrets.SUBSCRIBE_FORM_ACTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
