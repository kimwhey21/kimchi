name: Feature Draft

# 기준표(feature) 원고가 editorial/features/ 아래에 커밋되면 워드프레스에
# **임시저장**으로 올립니다. 주말 기준표 루틴(docs/routine_feature.md)이
# 원고를 쓰고 커밋하면 이 워크플로가 초안을 만들고, 공개는 사람이 "발행"이라고
# 한 뒤 `python -m src.publish_feature <원고> --publish`로 합니다.
#
# 일간 시황(editorial/*.json)은 editorial_publish.yml이 바로 공개하지만, 기준표는
# 규칙상 사람이 보고 나서 공개합니다(CLAUDE.md 「발행 워크플로우」). 그래서
# 워크플로를 따로 두고 기본을 임시저장으로 고정합니다.
on:
  push:
    paths:
      - "editorial/features/*.json"
  workflow_dispatch:
    inputs:
      path:
        description: "발행할 기준표 원고 경로 (공백으로 여러 개)"
        required: true
        default: ""
      publish_live:
        description: "공개 상태로 발행 (사용자가 '발행'이라고 한 뒤에만)"
        type: boolean
        required: false
        default: false

concurrency:
  group: feature-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        # 그래픽에 종목명·소제목이 한글로 들어갑니다. 폰트가 없으면 두부(□)가 찍힙니다.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 올릴 원고 결정
        id: pick
        run: |
          FILES=""
          if [ -n "${{ github.event.inputs.path }}" ]; then
            FILES="${{ github.event.inputs.path }}"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=d \
                      "${{ github.event.before }}" "${{ github.sha }}" -- editorial/features \
                    | grep -E '^editorial/features/[^/]+\.json$' | tr '\n' ' ' || true)
          fi
          echo "올릴 원고: ${FILES:-(없음)}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: 임시저장으로 올리기
        if: ${{ steps.pick.outputs.files != '' }}
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.publish_live }}" = "true" ]; then
            FLAG="--publish"
          fi
          for f in ${{ steps.pick.outputs.files }}; do
            echo "== $f =="
            python -m src.publish_feature "$f" $FLAG
          done
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          SUBSCRIBE_FORM_ACTION: ${{ secrets.SUBSCRIBE_FORM_ACTION }}
