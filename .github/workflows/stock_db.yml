name: Stock DB

# 본진 종목 데이터베이스(/stocks/<종목코드>/, /stocks/, 홈의 시장 판)를 매일 새 숫자로 채운다 (2026-09-27).
# 코스피·코스닥 전 종목 시세는 매번, 상세(지표·수급·재무·이력)는 시가총액 상위 300 + 나머지의 7분의 1(요일 순번).
# 받는 곳은 워드프레스 코드 조각 templates/wp_stock_db.php의 REST(fermata/v1/stocks)이고, 글·페이지는 만들지 않는다.
#
# 하루 두 번 도는 이유: 네이버 종목별 투자자 수급은 마감 직후엔 전날 줄까지만 나온다(2026-09-26 실측,
# scripts/fill_kr_flows.py와 같은 사정). 17:05 KST 실행이 그날 시세를, 다음 날 07:50 KST 실행이 그날 수급을 채운다.
# 아침 실행은 08:40이었는데 2026-09-28에 장 시작 전 네이버가 목록을 다시 채우는 중이라 2,490개만 받고 멈췄다 — 07:50으로 당겼다.
on:
  schedule:
    - cron: "5 8 * * 1-5"      # 17:05 KST 월~금 — 한국장 시세(market_brief의 16:20 수집·루틴과 겹치지 않게)
    - cron: "50 22 * * 0-5"    # 07:50 KST 월~토 — 전 거래일 수급(일~금 UTC = 월~토 KST 아침; 토요일은 금요일 수급)
  workflow_dispatch:

concurrency:
  group: stock-db
  cancel-in-progress: false

jobs:
  # 깃허브 예약이 늦게 와서 Cloudflare가 이미 누른 일을 또 하지 않게 (skip_guard.yml, 2026-09-29)
  guard:
    uses: ./.github/workflows/skip_guard.yml
    permissions:
      actions: read
    secrets: inherit
    with:
      mode: active

  run:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write       # 새 상장 종목의 영문명(data/stock_meta.json)을 커밋한다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 새 상장 종목 영문명 채우기
        # DART 영문명·업종. 이미 있는 종목은 건너뛰므로 평소엔 몇 초다. 키가 없으면 이름이 종목 코드로 나간다(페이지는 선다).
        run: |
          [ -n "$DART_API_KEY" ] || { echo "::warning::DART_API_KEY 시크릿이 없어 새 종목 이름을 못 채웁니다"; exit 0; }
          python -m src.stock_db meta || echo "::warning::DART 메타 갱신 실패 — 새 종목 이름이 코드로 나갑니다"
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: 배당 공시 새로 받기(한 달에 한 번)
        # 순위표의 배당은 DART 사업보고서 값이다(2026-09-28). 공시는 1년에 한두 번 바뀌므로 파일이 30일 넘으면 다시 받는다(40분 안팎).
        run: |
          [ -n "$DART_API_KEY" ] || { echo "::warning::DART_API_KEY가 없어 배당 공시를 새로 받지 못합니다"; exit 0; }
          python - <<'PY' || exit 0
          import json, datetime as dt, pathlib, sys
          p = pathlib.Path("data/stock_dividends.json")
          if p.exists() and (dt.date.today() - dt.date.fromisoformat(json.loads(p.read_text())["fetched"])).days < 30:
              print("배당 공시는 30일 안에 받은 것이 있습니다"); sys.exit(1)
          PY
          python -m src.stock_db dividends || echo "::warning::배당 공시 받기 실패 — 지난 파일로 순위표를 만듭니다"
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: 시세·상세 받아 워드프레스로
        run: python -m src.stock_db run --push
        env:
          # 다음 금융·사진 대조에서 한 원천으로만 쓴 종목이 있으면 운영 대화로 알린다(2026-10-05)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 종목 파일 커밋
        if: success()
        run: |
          git add data/stock_meta.json data/stock_metrics.json data/stock_dividends.json data/foreign_history.json
          git diff --cached --quiet && { echo "바뀐 파일 없음"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "종목 데이터: 순위표 지표·메타·배당 공시·외국인 수급 기록 갱신"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1

      - name: 실패 알림 (텔레그램 운영 대화)
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
