name: Daily Proof

# 밤 11시 반 증명서(2026-10-05) — 그날 독자가 본 것(시세 파일·본진 화면·오늘 글)을 다른 원천으로 다시 계산해 텔레그램 한 줄로
# 보낸다(src/daily_proof.py). 정시 실행은 Cloudflare 워커가 누르고(jobs.json direct 14:30 UTC) 이 cron은 예비다. 워커의 watch가
# 15:05 UTC에 "성공한 실행이 있나"를 보고 없으면 다시 누르고 '증명서가 오지 않았다'를 울린다 — 증명서의 부재가 곧 경보.
# 실행 성공 = 텔레그램 전송 성공이다(보내지 못하면 1로 끝난다).
on:
  schedule:
    - cron: "30 14 * * 0-6"   # 23:30 KST 매일
  workflow_dispatch:

jobs:
  guard:
    uses: ./.github/workflows/skip_guard.yml
    permissions:
      actions: read
    secrets: inherit
    with:
      mode: active

  proof:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read      # 오늘 돌았어야 할 작업의 실행 목록
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 400     # 오늘 커밋된 원고를 git log로 센다(하루 30~40 커밋)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 증명서
        run: python -m src.daily_proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}

      - name: 실패 알림 (텔레그램 운영 대화)
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
