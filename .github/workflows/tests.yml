name: Tests

# 발행은 자동인데 테스트는 손으로 돌리고 있었습니다. 2026-09-03에 로컬에서
# 돌린 테스트가 라이선스 필터 버그(CC BY-NC가 "cc by"에 걸려 통과)를 잡았는데,
# 안 돌렸으면 그대로 커밋돼 검수 없이 공개되는 경로에 들어갔을 것입니다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 그림을 실제로 그리는 테스트가 있습니다. 폰트가 없으면 한글이 두부(□)로
      # 찍히는데 예외가 안 나서 **테스트는 통과합니다.** 2026-09-06에 이 구멍을
      # 찾았습니다 — CI에서도 실제 폰트로 돌려야 가드가 의미가 있습니다.
      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        # 네트워크·워드프레스 자격증명 없이 도는 테스트만 있습니다.
        # 새로 추가할 때도 외부 호출은 mock으로 막아 주세요.
        run: python -m unittest discover -s tests -v

      - name: 실패 알림 (텔레그램 운영 대화)
        # 2026-09-12: 어떤 워크플로가 왜 죽었는지 휴대폰으로. 토큰이 없으면 조용히 넘어간다(curl이라 앞 단계가 어디서 죽었든 된다).
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
