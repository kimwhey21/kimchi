name: Daum Probe (temporary)
# 2026-10-05 일회용: 깃허브 러너(해외)에서 다음 금융 API가 열리는지 확인한다. 확인 뒤 지운다.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in 000660 207940 005930; do
            curl -s -m 15 -o /tmp/q.json -w "quotes $c HTTP %{http_code}\n" -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" \
              -H "Referer: https://finance.daum.net/quotes/A$c" "https://finance.daum.net/api/quotes/A$c?summary=false&changeStatistics=true"
            python3 -c "import json;d=json.load(open('/tmp/q.json'));print(d.get('date'),d.get('regularTradePrice'),d.get('tradePrice'),d.get('basePrice'))" || head -c 300 /tmp/q.json
            curl -s -m 15 -o /tmp/d.json -w "days $c HTTP %{http_code}\n" -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" \
              -H "Referer: https://finance.daum.net/quotes/A$c" "https://finance.daum.net/api/quote/A$c/days?symbolCode=A$c&page=1&perPage=70&pagination=true"
            python3 -c "import json;d=json.load(open('/tmp/d.json'))['data'];print(len(d),d[0]['date'],d[0]['tradePrice'],d[-1]['date'])" || head -c 300 /tmp/d.json
          done
