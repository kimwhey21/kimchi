name: Artifact Watch

# 루틴 결과물(시황·프리뷰·가이드·잡지·주말 글)이 마감 시각을 넘겨도 없으면 바로 알린다(2026-10-06, 감사 F-064·F-112).
# 마감(daily_proof.ARTIFACT_DUE) 10분 뒤마다 Cloudflare가 누르고(jobs.json direct) 이 cron은 예비다. 마감이 30분 안으로 지난 것만 본다.
on:
  schedule:
    - cron: "40 18 * * 0-6"   # 03:40 KST 잡지
    - cron: "10 23 * * 0-6"   # 08:10 KST 미국장 시세
    - cron: "10 0 * * 0-6"    # 09:10 KST 미국장 시황
    - cron: "40 0 * * 0-6"    # 09:40 KST 주간 점검
    - cron: "10 1 * * 0-6"    # 10:10 KST 주말 Checkpoint
    - cron: "10 2 * * 0-6"    # 11:10 KST 주간 결산
    - cron: "10 3 * * 0-6"    # 12:10 KST 영어 가이드
    - cron: "10 5 * * 0-6"    # 14:10 KST 한국어 가이드
    - cron: "15 7 * * 0-6"    # 16:15 KST 종가 사진
    - cron: "55 7 * * 0-6"    # 16:55 KST 한국장 시세
    - cron: "50 8 * * 0-6"    # 17:50 KST 한국장 시황
    - cron: "10 12 * * 0-6"   # 21:10 KST 다음 주 일정
    - cron: "40 13 * * 0-6"   # 22:40 KST 미국장 프리뷰
  workflow_dispatch:

jobs:
  guard:
    uses: ./.github/workflows/skip_guard.yml
    permissions:
      actions: read
    secrets: inherit
    with:
      mode: active

  watch:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 400     # 오늘 커밋된 원고를 git log로 센다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 마감 지난 결과물 확인
        run: python -m scripts.artifact_watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}

      - name: 실패 알림
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
