name: Publish Check

# 발행 시각이 지난 뒤 "그날 글이 실제로 사이트에 있는지"를 확인합니다.
#
# editorial_publish.yml의 verify_published는 발행 스크립트가 돌았을 때만
# 동작합니다. 루틴이 원고를 못 써서 아무것도 커밋되지 않은 날이나, 예약 실행이
# 시세를 못 받고 멈춘 날은 아무도 실패를 알리지 않습니다. 2026-09-03 아침에
# 워크플로가 성공으로 끝났는데 한국장 글이 올라가지 않은 것을 사람이 사이트를
# 열어보고서야 알았습니다. 이 워크플로가 실패하면 깃허브가 메일을 보냅니다.
on:
  schedule:
    # 한국장: 루틴 호출 16:20~16:40 KST, 예비 예약 17:40 → 19:00 KST(10:00 UTC)에 확인.
    # 전에는 17:20이었는데 루틴이 조금만 늦어도 글이 나가기 전에 울렸습니다
    # (2026-09-07: 17:35에 실패 메일, 글은 19:05에 정상 공개). 이 검사는 "오늘 글이
    # 결국 안 나왔다"만 알려야 하므로 예비 예약까지 끝난 뒤에 돕니다.
    - cron: "0 10 * * 1-5"
    # 미국장: 루틴 호출 07:20~07:40 KST, 예비 예약 08:40 → 10:00 KST(01:00 UTC)에 확인.
    # 수집(22:20 UTC 월~금)의 **다음날** UTC 아침이라 요일은 화~토(2-6)입니다.
    # 전에는 0-4라서 금요일 미국장을 빠뜨린 날에 빠뜨렸다는 사실조차 알리지
    # 않았습니다(2026-09-04) — 요일을 바꿀 때는 수집 요일과의 하루 어긋남을 같이
    # 계산할 것.
    - cron: "0 1 * * 2-6"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 발행 확인
        run: python -m src.check_publication
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

      - name: 실패 알림 (텔레그램 운영 대화)
        # 2026-09-12: 어떤 워크플로가 왜 죽었는지 휴대폰으로. 토큰이 없으면 조용히 넘어간다(curl이라 앞 단계가 어디서 죽었든 된다).
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
