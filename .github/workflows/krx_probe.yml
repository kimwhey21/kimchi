name: KRX probe (one-off)
# 2026-10-07: 깃허브(해외 접속)에서 거래소 정보데이터시스템 로그인이 되는지 한 번 확인 — 확인 뒤 지운다
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests python-dotenv
      - run: |
          python - <<'PY'
          from src.stock_db import KrxOfficial
          k = KrxOfficial()
          v = k.close("005930", "2026-10-06")
          print("삼성전자 10/6:", v, "| 종목 수:", len(k.days.get("2026-10-06", {})), "| 오류:", k.error or "없음")
          PY
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
