name: Editorial Publish

# 클라우드 루틴(조사·집필 담당)이 editorial/ 아래에 원고를 커밋하면,
# 워드프레스 시크릿을 가진 이 워크플로가 그 원고를 임시저장으로 올립니다.
# 이렇게 나눠야 워드프레스 비밀번호가 GitHub 밖으로 나가지 않습니다.
on:
  push:
    paths:
      # 하위 폴더는 넣지 않습니다. `editorial/features/`의 기준표 원고는 스키마가
      # 달라(market·price_data 없음) 이 워크플로가 발행할 수 없습니다. `**`로 두면
      # 기준표를 커밋할 때마다 자동 발행이 그 파일로 죽습니다.
      - "editorial/*.json"
  workflow_dispatch:
    inputs:
      path:
        description: "발행할 원고 경로 (비우면 가장 최근 파일). 공백으로 여러 개 지정 가능"
        required: false
        default: ""
      publish_live:
        # 기본값은 종전대로 임시저장입니다. 이 스위치는 이미 공개된 같은
        # 거래일 글을 정정본으로 다시 올려야 할 때만 켭니다 — 원고를 고쳐
        # 썼는데 커밋 내용이 같아 push 트리거가 걸리지 않는 경우입니다.
        # (2026-09-03: 대표 이미지 alt 수정과 사진 키 전달 뒤 두 글을 다시
        # 공개해야 했는데, 원고 파일 자체는 바뀌지 않아 이 경로가 필요했습니다.)
        description: "공개 상태로 발행 (기본은 임시저장)"
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 아래 '발행할 원고 결정'이 직전 커밋과 비교하려면 이력이 필요합니다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        # 본문 데이터 그래픽에 종목명·업종명이 한글로 들어갑니다. 러너에는
        # 한글 폰트가 없어 2026-09-04에 두부(□□□)로 찍힌 그림이 올라갔습니다.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 발행할 원고 결정
        id: pick
        # 푸시에 실제로 들어 있던 원고 파일을 그대로 넘깁니다.
        #
        # 전에는 아무 경로도 넘기지 않고 스크립트의 "가장 최근 파일"에 맡겼는데,
        # 그 기본값이 파일명 알파벳 순이라 "us" > "kr"로 미국장 원고가 항상
        # 이겼습니다. 2026-09-03 한국장 원고를 커밋했을 때 미국장 글이 다시
        # 올라가고(이미 공개 상태라 아무 변화 없음) 한국장 글은 발행되지 않은
        # 채 워크플로가 성공으로 끝났습니다.
        run: |
          FILES=""
          if [ -n "${{ github.event.inputs.path }}" ]; then
            FILES="${{ github.event.inputs.path }}"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=d \
                      "${{ github.event.before }}" "${{ github.sha }}" -- editorial \
                    | grep -E '^editorial/[^/]+\.json$' | tr '\n' ' ' || true)
          fi
          echo "발행 대상: ${FILES:-(지정 없음 → 가장 최근 거래일 원고)}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: 원고 발행
        # 원고 커밋(push)으로 자동 실행된 경우에는 바로 공개합니다 — 루틴이
        # 원고를 커밋하는 시점에 이미 조사·집필이 끝난 상태이고, 그 뒤로는
        # 아무도 검수 단계를 밟지 않기 때문입니다. 안전장치는 앞단의
        # editorial_quality(한국어·영어) 검사이며, 통과하지 못하면 예외로
        # 멈춰 아무것도 올라가지 않습니다.
        # 손으로 돌리는 workflow_dispatch는 종전대로 임시저장입니다.
        run: |
          ARGS="${{ steps.pick.outputs.files }}"
          if [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event.inputs.publish_live }}" = "true" ]; then
            ARGS="$ARGS --publish-live"
          fi
          python -m src.publish_editorial $ARGS
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          SUBSCRIBE_FORM_ACTION: ${{ secrets.SUBSCRIBE_FORM_ACTION }}
          # 인사이트 스토리 사진용입니다. 이 키가 없으면 fetch_images가 조용히
          # None을 돌려주기 때문에(fetch_images.py), 자동 공개된 글에는 사진이
          # 한 장도 붙지 않았습니다 — 2026-09-03에 확인했습니다.
          #
          # 생성형 AI 키(Anthropic·OpenAI)를 주지 않는 원칙은 그대로입니다.
          # 그 원칙은 유료 생성 경로가 자동 실행에 다시 붙는 것을 막으려는
          # 것이고, Unsplash는 사진 검색만 하는 무료 키라 성격이 다릅니다.
          # 사진은 그날 코어 종목명이 든 검색어에만 붙습니다
          # (publish_editorial._concrete_image_query).
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: 벤치마크 대조 (보고만)
        # 검사가 통과했다는 것은 "encode한 규칙을 어기지 않았다"는 뜻이지
        # "벤치마크에 가까워졌다"는 뜻이 아닙니다. 2026-09-05에 검사 다섯 개를
        # 통과한 글이 '습니다' 57%(벤치마크 45%)·문장 136개(벤치마크 38개)로
        # 나갔고, 사람이 읽고 지적할 때까지 아무도 몰랐습니다.
        #
        # 발행을 막지는 않습니다(|| true). 어미 비율을 기계로 강제하면 억지로
        # 어미만 바꾼 글이 나옵니다. 여기서는 어긋난 항목을 로그에 남기기만 하고,
        # 고칠지는 사람이 판단합니다.
        if: always()
        run: python -m scripts.compare_to_benchmark ${{ steps.pick.outputs.files }} || true

      - name: 결과물 업로드 (백업용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ github.run_id }}
          path: output/*_editorial*.html
          if-no-files-found: ignore
