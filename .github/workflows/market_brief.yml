name: Market Brief

on:
  schedule:
    # 한국시간(KST) 기준 평일 07:00 = UTC 전날 22:00 → 미국장(전날 마감) 요약
    - cron: "0 22 * * 0-4"
    # 한국시간(KST) 기준 평일 16:00 = UTC 당일 07:00 → 한국장 마감 요약
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "수동 실행 시 대상 시장 (us 또는 kr)"
        required: true
        default: "us"
      with_english:
        description: "kr 실행 시 영어 번역판도 만들지 (Claude API 호출 1회 추가 = 비용 추가)"
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 어떤 시장을 실행할지 결정
        id: market
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * 0-4" ]; then
            echo "market=us" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 1-5" ]; then
            echo "market=kr" >> "$GITHUB_OUTPUT"
          else
            echo "market=${{ github.event.inputs.market }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 실행
        run: |
          ARGS="--market ${{ steps.market.outputs.market }}"
          if [ "${{ steps.market.outputs.market }}" = "kr" ] && [ "${{ github.event.inputs.with_english }}" = "true" ]; then
            ARGS="$ARGS --en"
          fi
          python -m src.main $ARGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          SUBSCRIBE_FORM_ACTION: ${{ secrets.SUBSCRIBE_FORM_ACTION }}

      - name: 결과물 업로드 (백업용)
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-${{ steps.market.outputs.market }}-${{ github.run_id }}
          path: output/*
