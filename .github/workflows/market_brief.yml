name: Market Brief

on:
  schedule:
    # 마감 정각에 돌리면 시세가 아직 안 채워져 실패합니다. 실제로 16:00 정각
    # 스케줄은 USD/KRW가 NaN이라 3회(15초) 재시도 후 죽었고, 7분 뒤 수동
    # 실행은 성공했습니다. 그래서 두 시장 모두 20분 뒤로 미룹니다.
    # 한국시간(KST) 기준 07:20 = UTC 전날 22:20 → 미국장(그날 마감) 요약.
    #
    # 요일은 월~금(UTC)입니다. 미국장 마감은 UTC 기준 그날 20~21시이므로
    # 금요일 마감을 담으려면 금요일 22:20 실행이 있어야 합니다. 전에는 0-4
    # (일~목)이었는데, 그러면 **금요일 미국장이 한 번도 다뤄지지 않고** 정작
    # 미국장이 열리지 않는 일요일에 실행이 걸립니다. 2026-09-04(금) 미국장은
    # 8월 고용보고서가 나와 3대 지수가 모두 내린 날인데 그대로 빠졌습니다.
    #
    # 요일 마스크는 "이날은 장이 있을 수 있다"는 상한일 뿐입니다. 휴장은
    # 달력이 아니라 데이터로 거릅니다 — fetch_us의 trading_date가 지수의 실제
    # 마지막 거래일이라, 휴장이면 파일명이 그대로여서 커밋할 것이 없고 루틴도
    # 같은 거래일 원고가 이미 있어 종료합니다.
    - cron: "20 22 * * 1-5"
    # 재시도 두 번. 첫 실행이 성공했으면 같은 거래일 파일을 다시 써도 내용이
    # 같아 커밋할 것이 없고, main.py의 "[중단] … 이미 생성·처리되어 건너뜁니다"
    # 가드에 걸려 바로 끝납니다. 실패했을 때만 실제로 일을 합니다.
    #
    # 왜 필요한가: 하루에 시도가 한 번뿐이라, 죽으면 사람이 알아채기 전까지
    # 그날이 통째로 없어집니다. 2026-08-31~09-01에 정각 실행이 USD/KRW 결측으로
    # 세 번 연속 죽었고 7분 뒤 수동 실행은 성공했습니다. 그때는 스케줄을 20분
    # 미루는 것으로 덮었지만, 지연이 21분이면 또 같은 일이 납니다.
    #
    # 루틴은 첫 성공 실행이 시세를 커밋한 직후 바로 깨웁니다(아래 '클라우드 루틴
    # 호출'). 루틴의 자체 예약은 그로부터 한 시간 뒤(17:40/08:40 KST)의 예비이므로
    # 재시도는 그 예비 전에 끝나야 합니다.
    - cron: "27 22 * * 1-5"
    - cron: "34 22 * * 1-5"
    # 한국시간(KST) 기준 평일 16:20 = UTC 당일 07:20 → 한국장 마감 요약
    - cron: "20 7 * * 1-5"
    - cron: "27 7 * * 1-5"
    - cron: "34 7 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "수동 실행 시 대상 시장 (us 또는 kr)"
        required: true
        default: "us"
      fire_routine:
        description: "시세 커밋 뒤 클라우드 루틴을 강제로 호출 (API 트리거 연결 시험용)"
        required: false
        default: false
        type: boolean

# 같은 시장의 실행을 한 번에 하나만 돌립니다.
#
# 재시도를 :20/:27/:34로 넣었는데 동시 실행 방지가 없었습니다. 결측 재시도가
# 최대 220초까지 기다리므로 첫 실행이 다음 실행과 겹칠 수 있고, 겹치면 두 실행이
# 같은 data/price_<market>_<거래일>.json을 각각 커밋한 뒤 같은 main에 push합니다.
# 뒤늦은 쪽이 non-fast-forward로 죽으면 "실패한 날을 재시도한다"는 목적과 반대로
# 그날 시세를 잃을 수 있습니다.
#
# cancel-in-progress를 false로 두는 이유: 앞 실행을 죽이면 이미 절반쯤 받아 둔
# 시세가 사라집니다. 뒤 실행은 앞이 끝날 때까지 기다렸다가, 그때는 파일이 이미
# 있으므로 커밋할 것이 없어 조용히 끝납니다.
concurrency:
  group: market-brief-${{ github.event.inputs.market || (contains(github.event.schedule, ' 22 ') && 'us' || 'kr') }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 수집한 시세를 data/ 아래로 커밋하기 위해 쓰기 권한이 필요합니다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 어떤 시장을 실행할지 결정
        id: market
        run: |
          # 시장은 예약의 "시(hour)"로 가릅니다. 재시도가 생기면서 분만 다른
          # 예약이 여럿이 됐는데, 전체 문자열로 비교하면 하나 추가할 때마다
          # 여기도 같이 고쳐야 하고 빠뜨리면 조용히 엉뚱한 시장을 돌립니다.
          case "${{ github.event.schedule }}" in
            *" 22 * * "*) echo "market=us" >> "$GITHUB_OUTPUT" ;;
            *" 7 * * "*)  echo "market=kr" >> "$GITHUB_OUTPUT" ;;
            *)            echo "market=${{ github.event.inputs.market }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 시세 수집
        # 2026-09-07부터 이 워크플로는 **시세를 받아 커밋하고 루틴을 깨우는 일만**
        # 합니다. 전에는 여기서 규칙 기반 초안(generate_free)까지 만들어 워드프레스에
        # draft로 올렸는데, 그 초안은 규칙상 절대 공개되지 않는 부산물이면서
        # 관리자 화면 맨 위에 매일 쌓여 "데이터만 나열한 글"로 오인됐고, 초안
        # 검사가 죽으면 시세 커밋까지 끌고 죽었습니다(2026-09-04). 한글 폰트가 없는
        # 러너에서 그림을 두부(□)로 그리는 경고도 매번 여덟 줄씩 남겼습니다.
        # 초안이 필요하면 손으로 `python -m src.main --market kr --en`을 돌리면
        # 됩니다 — 코드는 그대로 있고 자동 실행에서만 뺐습니다. 그래서 이 단계에는
        # 워드프레스 시크릿을 넘기지 않습니다.
        run: python -m src.main --market ${{ steps.market.outputs.market }} --fetch-only

      - name: 재료(이야기 엔진) 뽑기
        # 시황 루틴이 시세와 함께 읽는 재료(2026-09-08, 사용자 승인 — 제안 4번 "시황에도
        # 재료 파일을"). 루틴 샌드박스는 야후가 막혀 밸류에이션·등급변경·실적일정·계절성
        # 엔진이 실패하므로(2026-09-07 실측) 러너가 대신 뽑아 시세와 같은 커밋에 넣는다.
        # 파일명은 시세 파일과 같은 거래일. 오늘 처음 생긴 시세 파일이 있을 때만 돌린다 —
        # 재시도 실행(:27/:34)이 같은 재료를 다시 뽑아 커밋을 쌓지 않게. 실패해도 시세
        # 커밋은 막지 않는다(|| true) — 재료 없는 날은 루틴이 파일이 없는 것을 보고 판단한다.
        if: success()
        run: |
          M=${{ steps.market.outputs.market }}
          if ! git status --porcelain data/ | grep -qE '^\?\? data/price_'"$M"'_'; then
            echo "오늘 처음 생긴 시세 파일이 없어 재료를 다시 뽑지 않습니다."
            exit 0
          fi
          D=$(ls data/price_${M}_*.json | sort | tail -1 | sed -E 's/.*_([0-9-]+)\.json/\1/')
          python -m src.story_engines all --market "$M" > "data/engines_${M}_${D}.txt" 2>&1 || true
          echo "재료 파일: data/engines_${M}_${D}.txt ($(wc -l < "data/engines_${M}_${D}.txt") 줄)"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: 시세 파일 커밋
        id: commit
        # 조사·집필을 맡는 클라우드 루틴은 샌드박스 네트워크 정책 때문에
        # 네이버·야후·KRX에 접속하지 못합니다(2026-09-02 실측: CONNECT 403).
        # 러너에서는 받아지므로, 여기서 받은 시세를 저장소에 남겨 루틴이
        # 읽어가게 합니다. data/**.json은 Editorial Publish를 트리거하지
        # 않으므로(그쪽은 editorial/**.json만 봄) 발행이 두 번 일어나지 않습니다.
        #
        # always()인 이유: 앞 단계가 죽어도 이미 받아 둔 시세는 남겨야 합니다.
        # 2026-09-04에 시세 수집은 성공했는데 같은 실행의 영어 초안 검사가
        # 예외로 죽었고, 이 스텝이 실행되지 않아 파일이 러너와 함께 사라졌습니다.
        # 루틴은 읽을 데이터가 없어 그날 글을 쓰지 못했습니다. 검수용 초안 하나가
        # 그날 발행 전체를 막은 셈입니다.
        #
        # 수동 실행에서도 커밋합니다. 시세는 발행물이 아니라 원고의 재료이고,
        # 예약 실행이 실패한 날 사람이 복구할 방법이 필요합니다.
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "새로 커밋할 시세 파일이 없습니다."
            exit 0
          fi
          # 오늘 **처음 생긴** 시세 파일(untracked, `??`)만 루틴 호출의 근거가 됩니다.
          # 재시도 실행(:27/:34)은 같은 파일을 고쳐 쓸 뿐(`M`)이라 루틴을 다시 깨우지
          # 않습니다 — 같은 날 루틴 세션이 둘 뜨면 같은 원고를 두 번 씁니다.
          NEW_FILE=$(git status --porcelain data/ | awk '$1=="??" {print $2}' | grep -E 'price_(kr|us)_[0-9-]+\.json$' | head -1 || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "시세 데이터: ${{ steps.market.outputs.market }} $(date -u +%Y-%m-%d)"

          # push가 거절되면 최신 main을 다시 읽고 rebase한 뒤 다시 시도합니다.
          # 동시 실행은 concurrency로 막았지만, 루틴이 원고를 push하는 것과
          # 겹칠 수 있습니다(같은 저장소를 씁니다).
          #
          # rebase가 충돌하면 그만둡니다. 여기서 억지로 밀면 남의 커밋을 덮어씁니다 —
          # 시세 파일 하나 때문에 원고를 잃는 것이 더 나쁩니다.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "시세 파일 커밋 완료 (시도 $attempt)"
              echo "new_file=$NEW_FILE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "[안내] push 실패 — 최신 main을 다시 읽고 재시도합니다 ($attempt/3)"
            git fetch origin main
            # 다른 실행이 이미 같은 거래일 시세를 올렸으면 우리는 할 일이 없습니다.
            if git diff --quiet origin/main -- data/; then
              echo "다른 실행이 같은 시세를 이미 커밋했습니다. 정상 종료합니다."
              exit 0
            fi
            sleep 5
          done
          echo "::error::시세 파일을 push하지 못했습니다. main을 확인하세요."
          exit 1

      - name: 클라우드 루틴 호출
        # 시세 파일이 오늘 처음 커밋된 직후 조사·집필 루틴을 바로 깨웁니다.
        # 전에는 루틴이 자체 예약(16:40 KST)까지 기다렸고, 2026-09-07에는 그 예약이
        # 2시간 8분 늦게 떠서 글이 19:05에 나갔습니다. 루틴의 API 트리거(루틴별
        # URL + 토큰, 문서: code.claude.com/docs/en/routines)로 호출하면 예약
        # 지연과 무관해집니다. 루틴의 자체 예약은 한 시간 뒤로 물려 이 호출이
        # 실패한 날의 예비로만 둡니다.
        #
        # 호출 실패는 워크플로를 실패시키지 않습니다 — 예비 예약이 대신 돕니다.
        # 토큰 시크릿이 없는 시장은 안내만 남기고 넘어갑니다. 이 토큰은 "그 루틴을
        # 한 번 실행한다"만 할 수 있는 토큰이라 유료 생성 API 키가 아닙니다.
        if: ${{ steps.commit.outputs.new_file != '' || github.event.inputs.fire_routine == 'true' }}
        env:
          TOKEN_KR: ${{ secrets.ROUTINE_KR_FIRE_TOKEN }}
          TOKEN_US: ${{ secrets.ROUTINE_US_FIRE_TOKEN }}
          TRIGGER_KR: trig_01AVNVALb1zpNnsmmvfmXaCM
          TRIGGER_US: trig_013G1J6b1NTQx7RvkmoUkzqf
          MARKET: ${{ steps.market.outputs.market }}
          NEW_FILE: ${{ steps.commit.outputs.new_file }}
        run: |
          case "$MARKET" in
            kr) TOKEN="$TOKEN_KR"; TRIGGER="$TRIGGER_KR" ;;
            us) TOKEN="$TOKEN_US"; TRIGGER="$TRIGGER_US" ;;
            *)  echo "::warning::알 수 없는 시장: $MARKET"; exit 0 ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "::notice::ROUTINE_${MARKET^^}_FIRE_TOKEN 시크릿이 없어 루틴을 호출하지 않습니다. 루틴 자체 예약이 대신 돕니다."
            exit 0
          fi
          TEXT="시세 파일 ${NEW_FILE:-수동 시험 호출}이 방금 커밋됐습니다. 평소 절차대로 진행하세요."
          RESPONSE=$(curl -sS -m 30 -w '\n%{http_code}' -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${TRIGGER}/fire" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"text": "%s"}' "$TEXT")") \
            || { echo "::warning::루틴 호출에 실패했습니다(네트워크). 루틴 자체 예약이 대신 돕니다."; exit 0; }
          CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
            echo "루틴 호출 성공 ($MARKET): $BODY"
          else
            echo "::warning::루틴 호출 HTTP $CODE ($MARKET): $BODY — 루틴 자체 예약이 대신 돕니다."
          fi

      - name: 실패 알림 (텔레그램 운영 대화)
        # 2026-09-12: 어떤 워크플로가 왜 죽었는지 휴대폰으로. 토큰이 없으면 조용히 넘어간다(curl이라 앞 단계가 어디서 죽었든 된다).
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode text="❌ ${{ github.workflow }} 실패 (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
