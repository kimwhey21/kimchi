name: Market Brief

on:
  schedule:
    # 마감 정각에 돌리면 시세가 아직 안 채워져 실패합니다. 실제로 16:00 정각
    # 스케줄은 USD/KRW가 NaN이라 3회(15초) 재시도 후 죽었고, 7분 뒤 수동
    # 실행은 성공했습니다. 그래서 두 시장 모두 20분 뒤로 미룹니다.
    # 한국시간(KST) 기준 07:20 = UTC 전날 22:20 → 미국장(그날 마감) 요약.
    #
    # 요일은 월~금(UTC)입니다. 미국장 마감은 UTC 기준 그날 20~21시이므로
    # 금요일 마감을 담으려면 금요일 22:20 실행이 있어야 합니다. 전에는 0-4
    # (일~목)이었는데, 그러면 **금요일 미국장이 한 번도 다뤄지지 않고** 정작
    # 미국장이 열리지 않는 일요일에 실행이 걸립니다. 2026-09-04(금) 미국장은
    # 8월 고용보고서가 나와 3대 지수가 모두 내린 날인데 그대로 빠졌습니다.
    #
    # 요일 마스크는 "이날은 장이 있을 수 있다"는 상한일 뿐입니다. 휴장은
    # 달력이 아니라 데이터로 거릅니다 — fetch_us의 trading_date가 지수의 실제
    # 마지막 거래일이라, 휴장이면 파일명이 그대로여서 커밋할 것이 없고 루틴도
    # 같은 거래일 원고가 이미 있어 종료합니다.
    - cron: "20 22 * * 1-5"
    # 재시도 두 번. 첫 실행이 성공했으면 같은 거래일 파일을 다시 써도 내용이
    # 같아 커밋할 것이 없고, main.py의 "[중단] … 이미 생성·처리되어 건너뜁니다"
    # 가드에 걸려 바로 끝납니다. 실패했을 때만 실제로 일을 합니다.
    #
    # 왜 필요한가: 하루에 시도가 한 번뿐이라, 죽으면 사람이 알아채기 전까지
    # 그날이 통째로 없어집니다. 2026-08-31~09-01에 정각 실행이 USD/KRW 결측으로
    # 세 번 연속 죽었고 7분 뒤 수동 실행은 성공했습니다. 그때는 스케줄을 20분
    # 미루는 것으로 덮었지만, 지연이 21분이면 또 같은 일이 납니다.
    #
    # 루틴이 :40에 원고를 쓰므로 재시도는 그 전에 끝나야 합니다.
    - cron: "27 22 * * 1-5"
    - cron: "34 22 * * 1-5"
    # 한국시간(KST) 기준 평일 16:20 = UTC 당일 07:20 → 한국장 마감 요약
    - cron: "20 7 * * 1-5"
    - cron: "27 7 * * 1-5"
    - cron: "34 7 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "수동 실행 시 대상 시장 (us 또는 kr)"
        required: true
        default: "us"

# 같은 시장의 실행을 한 번에 하나만 돌립니다.
#
# 재시도를 :20/:27/:34로 넣었는데 동시 실행 방지가 없었습니다. 결측 재시도가
# 최대 220초까지 기다리므로 첫 실행이 다음 실행과 겹칠 수 있고, 겹치면 두 실행이
# 같은 data/price_<market>_<거래일>.json을 각각 커밋한 뒤 같은 main에 push합니다.
# 뒤늦은 쪽이 non-fast-forward로 죽으면 "실패한 날을 재시도한다"는 목적과 반대로
# 그날 시세를 잃을 수 있습니다.
#
# cancel-in-progress를 false로 두는 이유: 앞 실행을 죽이면 이미 절반쯤 받아 둔
# 시세가 사라집니다. 뒤 실행은 앞이 끝날 때까지 기다렸다가, 그때는 파일이 이미
# 있으므로 커밋할 것이 없어 조용히 끝납니다.
concurrency:
  group: market-brief-${{ github.event.inputs.market || (contains(github.event.schedule, ' 22 ') && 'us' || 'kr') }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 수집한 시세를 data/ 아래로 커밋하기 위해 쓰기 권한이 필요합니다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 어떤 시장을 실행할지 결정
        id: market
        run: |
          # 시장은 예약의 "시(hour)"로 가릅니다. 재시도가 생기면서 분만 다른
          # 예약이 여럿이 됐는데, 전체 문자열로 비교하면 하나 추가할 때마다
          # 여기도 같이 고쳐야 하고 빠뜨리면 조용히 엉뚱한 시장을 돌립니다.
          case "${{ github.event.schedule }}" in
            *" 22 * * "*) echo "market=us" >> "$GITHUB_OUTPUT" ;;
            *" 7 * * "*)  echo "market=kr" >> "$GITHUB_OUTPUT" ;;
            *)            echo "market=${{ github.event.inputs.market }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 실행
        run: |
          ARGS="--market ${{ steps.market.outputs.market }}"
          if [ "${{ steps.market.outputs.market }}" = "kr" ]; then
            ARGS="$ARGS --en"
          fi
          # 이 경로는 --publish-live를 붙이지 않습니다. src/generate_free.py는
          # 시세와 RSS 제목을 고정 문장 틀에 끼워 넣는 규칙 기반 코드라,
          # 결과물이 "검수 전 초안"이지 발행 가능한 원고가 아닙니다.
          # 2026-09-02에 한 번 예약 실행을 바로 공개해 봤다가 되돌렸습니다:
          # 같은 숫자를 카드와 문단에 두 번 쓰고, 그날 장세와 무관한 RSS 제목을
          # 붙이고, 매일 똑같은 마무리 문장이 나갔습니다.
          # 바로 공개해도 되는 건 조사·집필이 끝난 editorial/*.json 뿐이며
          # 그건 editorial_publish.yml이 담당합니다.
          python -m src.main $ARGS
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          SUBSCRIBE_FORM_ACTION: ${{ secrets.SUBSCRIBE_FORM_ACTION }}

      - name: 시세 파일 커밋
        # 조사·집필을 맡는 클라우드 루틴은 샌드박스 네트워크 정책 때문에
        # 네이버·야후·KRX에 접속하지 못합니다(2026-09-02 실측: CONNECT 403).
        # 러너에서는 받아지므로, 여기서 받은 시세를 저장소에 남겨 루틴이
        # 읽어가게 합니다. data/**.json은 Editorial Publish를 트리거하지
        # 않으므로(그쪽은 editorial/**.json만 봄) 발행이 두 번 일어나지 않습니다.
        #
        # always()인 이유: 앞 단계가 죽어도 이미 받아 둔 시세는 남겨야 합니다.
        # 2026-09-04에 시세 수집은 성공했는데 같은 실행의 영어 초안 검사가
        # 예외로 죽었고, 이 스텝이 실행되지 않아 파일이 러너와 함께 사라졌습니다.
        # 루틴은 읽을 데이터가 없어 그날 글을 쓰지 못했습니다. 검수용 초안 하나가
        # 그날 발행 전체를 막은 셈입니다.
        #
        # 수동 실행에서도 커밋합니다. 시세는 발행물이 아니라 원고의 재료이고,
        # 예약 실행이 실패한 날 사람이 복구할 방법이 필요합니다.
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "새로 커밋할 시세 파일이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "시세 데이터: ${{ steps.market.outputs.market }} $(date -u +%Y-%m-%d)"

          # push가 거절되면 최신 main을 다시 읽고 rebase한 뒤 다시 시도합니다.
          # 동시 실행은 concurrency로 막았지만, 루틴이 원고를 push하는 것과
          # 겹칠 수 있습니다(같은 저장소를 씁니다).
          #
          # rebase가 충돌하면 그만둡니다. 여기서 억지로 밀면 남의 커밋을 덮어씁니다 —
          # 시세 파일 하나 때문에 원고를 잃는 것이 더 나쁩니다.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "시세 파일 커밋 완료 (시도 $attempt)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "[안내] push 실패 — 최신 main을 다시 읽고 재시도합니다 ($attempt/3)"
            git fetch origin main
            # 다른 실행이 이미 같은 거래일 시세를 올렸으면 우리는 할 일이 없습니다.
            if git diff --quiet origin/main -- data/; then
              echo "다른 실행이 같은 시세를 이미 커밋했습니다. 정상 종료합니다."
              exit 0
            fi
            sleep 5
          done
          echo "::error::시세 파일을 push하지 못했습니다. main을 확인하세요."
          exit 1

      - name: 결과물 업로드 (백업용)
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-${{ steps.market.outputs.market }}-${{ github.run_id }}
          path: output/*
